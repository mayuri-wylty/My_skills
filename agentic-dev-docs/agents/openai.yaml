display_name: Agentic Dev Docs
short_description: Manually create docs-first workflows with project-profile workstreams and permission matrices.
default_prompt: >
  Use agentic-dev-docs skill to turn my project idea into a docs-first development workflow with one main controller, project-profile-based workstreams, a required permission matrix, lifecycle-aware subagent reuse rules, explicit real-subagent model and reasoning_effort routing, a default of model gpt-5.6-luna plus reasoning_effort max, BLOCKED-HUMAN skip-and-retry handling for developer intervention, a user story document with traceable acceptance criteria, a copyable new-window startup prompt, a preflight environment check document, review gates, audit gates, manual test docs, local commits after verified independent tasks, and no git push or PR without explicit authorization.
